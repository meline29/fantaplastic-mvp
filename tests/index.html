<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests de la couche de données</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #F6F1E7; color: #0B2A4A; }
    li { margin: 4px 0; }
    .ok { color: #0E7C74; }
    .ko { color: #B3261E; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Tests de la couche de données – sprints 1 et 2</h1>
  <p id="resume">Tests en cours…</p>
  <ul id="liste"></ul>

  <script src="../js/db.js"></script>
  <script>
    (async function () {
      var liste = document.getElementById('liste');
      var nbOk = 0, nbKo = 0;

      function noter(nom, ok, detail) {
        var li = document.createElement('li');
        li.className = ok ? 'ok' : 'ko';
        li.textContent = (ok ? '✔ ' : '✘ ') + nom + (detail ? ' (' + detail + ')' : '');
        liste.appendChild(li);
        if (ok) nbOk++; else nbKo++;
      }

      async function doitEchouer(nom, promesse, morceauDuMessage) {
        try { await promesse; noter(nom, false, "aucune erreur levée"); }
        catch (e) { noter(nom, e.message.indexOf(morceauDuMessage) !== -1, e.message); }
      }

      // Instance séparée pour ne pas toucher aux données de démo
      var prefixe = 'test-' + Date.now();
      var db = creerFantaDB({ prefixe: prefixe });

      // US3
      var sorties = await db.listerSortiesAVenir();
      noter('US3 – la liste contient les 4 sorties à venir de la démo', sorties.length === 4, sorties.length + ' sorties');
      noter('US3 – la sortie passée n\'apparaît pas', sorties.every(function (s) { return new Date(s.date_debut) >= new Date(); }));
      var triee = sorties.every(function (s, i) { return i === 0 || new Date(sorties[i - 1].date_debut) <= new Date(s.date_debut); });
      noter('US3 – les sorties sont triées par date', triee);
      noter('US3 – places restantes = places - inscrits', sorties.every(function (s) { return s.places_restantes === Math.max(0, s.places - s.nb_inscrits); }));
      noter('US3 – une sortie pleine affiche 0 place restante', sorties.some(function (s) { return s.places_restantes === 0; }));

      // US4
      noter('US4 – chaque sortie a sa liste de matériel (asso et bénévoles)', sorties.every(function (s) { return Array.isArray(s.materiel_fourni) && Array.isArray(s.materiel_a_apporter); }));
      var detail = await db.obtenirSortie(sorties[0].id);
      noter('US4 – le détail d\'une sortie donne ce que le bénévole apporte', detail && detail.materiel_a_apporter.indexOf('Gants de jardinage') !== -1, detail && detail.materiel_a_apporter.join(', '));
      noter('US4 – le détail d\'une sortie donne ce que l\'asso apporte', detail && detail.materiel_fourni.indexOf('Pinces de ramassage') !== -1, detail && detail.materiel_fourni.join(', '));
      noter('US4 – le détail indique l\'organisateur et les places', detail.organisateur_prenom === 'Asso (démo)' && detail.places_restantes === sorties[0].places_restantes);
      noter('US4 – une sortie inconnue renvoie null', (await db.obtenirSortie('n-existe-pas')) === null);

      // US15
      noter('US15 – personne n\'est connecté au départ', (await db.utilisateurCourant()) === null);
      var profil = await db.inscrire({ prenom: '  Lou ', email: 'Lou@Exemple.fr ', motDePasse: 'motdepasse1' });
      noter('US15 – création de compte', profil && profil.prenom === 'Lou' && profil.email === 'lou@exemple.fr');
      noter('US15 – le nouveau compte est bénévole', profil.role === 'benevole');
      noter('US15 – connecté automatiquement après la création', (await db.utilisateurCourant()).id === profil.id);
      noter('US15 – le mot de passe n\'est jamais renvoyé', !('motDePasse' in profil) && !('empreinte' in profil));
      await doitEchouer('US15 – email déjà utilisé refusé', db.inscrire({ prenom: 'Lou', email: 'lou@exemple.fr', motDePasse: 'autre12345' }), 'existe déjà');
      await doitEchouer('US15 – prénom vide refusé', db.inscrire({ prenom: '  ', email: 'a@b.fr', motDePasse: '12345678' }), 'prénom');
      await doitEchouer('US15 – email invalide refusé', db.inscrire({ prenom: 'Al', email: 'pas-un-email', motDePasse: '12345678' }), 'email');
      await doitEchouer('US15 – mot de passe trop court refusé', db.inscrire({ prenom: 'Al', email: 'al@b.fr', motDePasse: '1234' }), '8 caractères');

      await db.deconnecter();
      var orga = await db.inscrire({ role: 'organisateur', prenom: 'Yann', email: 'yann@exemple.fr', motDePasse: 'motdepasse2' });
      noter('US15 – on peut créer un compte organisateur', orga.role === 'organisateur');
      await doitEchouer('US15 – rôle admin refusé à l\'inscription', db.inscrire({ role: 'admin', prenom: 'Al', email: 'admin@b.fr', motDePasse: '12345678' }), 'bénévole ou organisateur');

      await db.deconnecter();
      noter('US15 – déconnexion', (await db.utilisateurCourant()) === null);
      await doitEchouer('US15 – mauvais mot de passe refusé', db.connecter({ email: 'lou@exemple.fr', motDePasse: 'faux-mdp-123' }), 'incorrect');
      await doitEchouer('US15 – email inconnu refusé', db.connecter({ email: 'inconnu@exemple.fr', motDePasse: 'motdepasse1' }), 'incorrect');
      var reco = await db.connecter({ email: 'LOU@exemple.fr', motDePasse: 'motdepasse1' });
      noter('US15 – reconnexion (email insensible à la casse)', reco.id === profil.id);

      // US2
      function nouvelleSortie(modifs) {
        var jour = new Date();
        jour.setDate(jour.getDate() + 20);
        jour.setHours(9, 30, 0, 0);
        return Object.assign({
          titre: 'Nettoyage de la grève de Kerhuon', lieu: 'Plage du Passage', commune: 'Le Relecq-Kerhuon',
          date_debut: jour.toISOString(), duree_min: 90, places: 12,
          materiel_a_apporter: ' bottes , une gourde,,', materiel_fourni: 'sacs poubelle; pinces'
        }, modifs || {});
      }
      await doitEchouer('US2 – un bénévole ne peut pas créer de sortie', db.creerSortie(nouvelleSortie()), 'organisateurs');
      await db.deconnecter();
      await doitEchouer('US2 – il faut être connecté pour créer une sortie', db.creerSortie(nouvelleSortie()), 'Connecte-toi');
      await db.connecter({ email: 'yann@exemple.fr', motDePasse: 'motdepasse2' });
      var creee = await db.creerSortie(nouvelleSortie());
      noter('US2 – un organisateur crée une sortie, à son nom', creee && creee.titre === 'Nettoyage de la grève de Kerhuon' && creee.organisateur_prenom === 'Yann');
      noter('US2 – la nouvelle sortie a toutes ses places libres', creee.nb_inscrits === 0 && creee.places_restantes === 12);
      noter('US2 – le matériel tapé avec des virgules devient une liste',
        creee.materiel_a_apporter.join('|') === 'Bottes|Une gourde' && creee.materiel_fourni.join('|') === 'Gilets jaunes|Trousse de premiers secours|Sacs poubelle|Pinces',
        creee.materiel_a_apporter.join(', ') + ' / ' + creee.materiel_fourni.join(', '));
      var apres = await db.listerSortiesAVenir();
      var rangee = apres.every(function (s, i) { return i === 0 || new Date(apres[i - 1].date_debut) <= new Date(s.date_debut); });
      noter('US2 – la nouvelle sortie apparaît dans la liste, à sa date', apres.length === 5 && rangee && apres.some(function (s) { return s.id === creee.id; }));
      await doitEchouer('US2 – titre vide refusé', db.creerSortie(nouvelleSortie({ titre: '  ' })), 'titre');
      await doitEchouer('US2 – date manquante refusée', db.creerSortie(nouvelleSortie({ date_debut: null })), 'date');
      await doitEchouer('US2 – date passée refusée', db.creerSortie(nouvelleSortie({ date_debut: new Date(Date.now() - 3600000).toISOString() })), 'futur');
      await doitEchouer('US2 – 0 place refusée', db.creerSortie(nouvelleSortie({ places: 0 })), 'places');
      await doitEchouer('US2 – durée trop courte refusée', db.creerSortie(nouvelleSortie({ duree_min: 10 })), 'durée');

      // Sécurité : l'asso fournit toujours gilets jaunes et trousse de premiers secours
      noter('Sécurité – chaque sortie fournit gilets jaunes et trousse de premiers secours', apres.every(function (s) {
        return s.materiel_fourni[0] === 'Gilets jaunes' && s.materiel_fourni[1] === 'Trousse de premiers secours';
      }));
      var avecGilets = await db.creerSortie(nouvelleSortie({ titre: 'Sortie test gilets', materiel_fourni: 'gilet jaune, sacs, trousse de premiers secours' }));
      noter('Sécurité – pas de doublon si l\'organisateur les écrit déjà', avecGilets.materiel_fourni.join('|') === 'Gilets jaunes|Trousse de premiers secours|Sacs', avecGilets.materiel_fourni.join(', '));

      // Démo : bascule de rôle
      var redevenu = await db.changerRoleDemo('benevole');
      noter('Démo – on peut repasser en bénévole', redevenu.role === 'benevole' && (await db.utilisateurCourant()).role === 'benevole');
      await doitEchouer('Démo – redevenu bénévole, on ne peut plus créer de sortie', db.creerSortie(nouvelleSortie()), 'organisateurs');
      await doitEchouer('Démo – la bascule refuse le rôle admin', db.changerRoleDemo('admin'), 'bénévole ou organisateur');

      // US14 : inscription avec le formulaire de sécurité
      var engage = { risques_acceptes: true, engagement_incidents: true };
      await db.deconnecter();
      await doitEchouer('US14 – il faut être connecté pour s\'inscrire', db.inscrireASortie(creee.id, engage), 'Connecte-toi');
      await db.connecter({ email: 'lou@exemple.fr', motDePasse: 'motdepasse1' });
      await doitEchouer('US14 – refusée sans le formulaire de sécurité', db.inscrireASortie(creee.id), 'engagements');
      await doitEchouer('US14 – refusée si l\'engagement « incidents » n\'est pas coché', db.inscrireASortie(creee.id, { risques_acceptes: true, engagement_incidents: false }), 'engagements');
      var inscrite = await db.inscrireASortie(creee.id, engage);
      noter('US14 – acceptée avec les deux engagements', inscrite.je_suis_inscrit === true && inscrite.nb_inscrits === 1 && inscrite.places_restantes === 11);
      var stockees = JSON.parse(localStorage.getItem(prefixe + '.db.v1')).inscriptions;
      var ligne = stockees.find(function (i) { return i.sortie_id === creee.id; });
      noter('US14 – la date de l\'engagement de sécurité est gardée', !!ligne && !isNaN(new Date(ligne.securite_acceptee_le).getTime()));
      await doitEchouer('US14 – pas de double inscription', db.inscrireASortie(creee.id, engage), 'déjà inscrit');
      var pleine = apres.find(function (s) { return s.places_restantes === 0; });
      await doitEchouer('US14 – sortie complète refusée', db.inscrireASortie(pleine.id, engage), 'complète');
      var desinscrite = await db.desinscrireDeSortie(creee.id);
      noter('US14 – désinscription', desinscrite.je_suis_inscrit === false && desinscrite.nb_inscrits === 0);

      db._effacer();
      document.getElementById('resume').textContent = nbOk + ' test(s) OK, ' + nbKo + ' en échec';
      document.getElementById('resume').className = nbKo ? 'ko' : 'ok';
      document.title = (nbKo ? 'ECHEC ' : 'OK ') + nbOk + '/' + (nbOk + nbKo);
    })().catch(function (e) {
      document.getElementById('resume').textContent = 'Erreur pendant les tests : ' + e.message;
      document.getElementById('resume').className = 'ko';
    });
  </script>
</body>
</html>
