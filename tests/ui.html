<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Test du parcours dans l'appli</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; background: #F6F1E7; color: #0B2A4A; display: flex; gap: 24px; }
    iframe { width: 375px; height: 760px; border: 1px solid #999; background: #fff; }
    .ok { color: #0E7C74; } .ko { color: #B3261E; font-weight: bold; }
  </style>
</head>
<body>
  <iframe id="app"></iframe>
  <div>
    <h1>Parcours dans l'appli – sprints 1 et 2</h1>
    <p id="resume">Test en cours…</p>
    <ol id="etapes"></ol>
  </div>
  <script>
    // Rejoue le parcours de bout en bout dans l'appli : voir les sorties, créer un compte, se déconnecter.
    // Attention : remet les données de démo à zéro à la fin.
    var nbOk = 0, nbKo = 0;
    function noter(nom, ok) {
      var li = document.createElement('li');
      li.className = ok ? 'ok' : 'ko';
      li.textContent = (ok ? '✔ ' : '✘ ') + nom;
      document.getElementById('etapes').appendChild(li);
      if (ok) nbOk++; else nbKo++;
    }
    function attendre(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    async function attendreQue(test, maxMs) {
      var t = 0;
      while (t < (maxMs || 4000)) { if (test()) return true; await attendre(100); t += 100; }
      return false;
    }

    document.getElementById('app').addEventListener('load', async function () {
      var win = this.contentWindow, doc = win.document;
      function texte() { return doc.body.innerText; }
      function bouton(libelle) {
        return Array.from(doc.querySelectorAll('button')).find(function (b) { return b.textContent.replace(/[‹›+]/g, '').trim() === libelle; });
      }
      function choisir(label, valeur) {
        var liste = Array.from(doc.querySelectorAll('label')).find(function (l) { return l.textContent.indexOf(label) === 0; }).querySelector('select');
        var setter = Object.getOwnPropertyDescriptor(win.HTMLSelectElement.prototype, 'value').set;
        setter.call(liste, valeur);
        liste.dispatchEvent(new win.Event('change', { bubbles: true }));
      }
      function saisir(label, valeur) {
        var champ = Array.from(doc.querySelectorAll('label')).find(function (l) { return l.textContent.indexOf(label) === 0; }).querySelector('input');
        var setter = Object.getOwnPropertyDescriptor(win.HTMLInputElement.prototype, 'value').set;
        setter.call(champ, valeur);
        champ.dispatchEvent(new win.Event('input', { bubbles: true }));
      }

      try {
        await attendreQue(function () { return doc.querySelectorAll('main li').length > 0; });

        noter('US3 – 4 sorties à venir affichées', doc.querySelectorAll('main li').length === 4);
        noter('US3 – une sortie affichée "Complet"', texte().indexOf('Complet') !== -1);
        noter('US3 – places restantes affichées', /\d+ places restantes/.test(texte()));

        // US4 : un clic sur une sortie montre le matériel
        doc.querySelector('main li button').click();
        await attendreQue(function () { return texte().indexOf('Ce que tu apportes') !== -1; });
        noter('US4 – un clic sur une sortie ouvre son détail', !!doc.querySelector('main h1') && doc.querySelector('main h1').textContent.indexOf('Moulin Blanc') !== -1);
        noter('US4 – les objets à apporter par le bénévole sont indiqués', texte().indexOf('Ce que tu apportes') !== -1 && texte().indexOf('Gants de jardinage') !== -1);
        noter('US4 – les objets apportés par l\'asso sont indiqués', texte().indexOf('Ce que l\'asso apporte') !== -1 && texte().indexOf('Pinces de ramassage') !== -1);
        noter('Sécurité – l\'asso apporte gilets jaunes et trousse de premiers secours', texte().indexOf('Gilets jaunes') !== -1 && texte().indexOf('Trousse de premiers secours') !== -1);
        noter("US14 – sans compte, la fiche propose de se connecter pour s'inscrire",!!bouton("Me connecter pour m'inscrire") && !bouton("Je m'inscris"));
        bouton('Toutes les sorties').click();
        await attendreQue(function () { return doc.querySelectorAll('main li').length === 4; });
        noter('US4 – retour à la liste des sorties', doc.querySelectorAll('main li').length === 4);

        bouton('Je crée mon compte').click();
        await attendreQue(function () { return !!doc.querySelector('form'); });
        noter('US15 – le formulaire de création de compte s\'ouvre', !!doc.querySelector('form'));
        noter('US15 – la phrase grise « données de démonstration » est en bas', !!doc.querySelector('footer') && doc.querySelector('footer').textContent.indexOf('données de démonstration') !== -1);

        var radios = doc.querySelectorAll('input[name=role]');
        noter('US15 – on peut choisir bénévole ou organisateur', radios.length === 2);
        noter('US15 – « Bénévole » est coché par défaut', doc.querySelector('input[name=role][value=benevole]').checked);
        doc.querySelector('input[name=role][value=organisateur]').closest('label').click();
        await attendreQue(function () { return doc.querySelector('input[name=role][value=organisateur]').checked; });
        noter('US15 – on peut sélectionner « Organisateur »', doc.querySelector('input[name=role][value=organisateur]').checked);

        saisir('Prénom', 'Lou');
        saisir('Email', 'lou@exemple.fr');
        saisir('Mot de passe', '1234');
        bouton('Créer mon compte').click();
        await attendreQue(function () { return texte().indexOf('8 caractères minimum') !== -1 && !!doc.querySelector('[role=alert]'); });
        noter('US15 – mot de passe trop court : message d\'erreur', !!doc.querySelector('[role=alert]'));

        saisir('Mot de passe', 'motdepasse1');
        bouton('Créer mon compte').click();
        await attendreQue(function () { return !!bouton('Déconnexion'); });
        noter('US15 – compte créé et connecté (bouton Déconnexion)', !!bouton('Déconnexion'));
        noter('US15 – message de bienvenue avec le prénom', texte().indexOf('Bienvenue Lou') !== -1);
        var roleActif = doc.querySelector('[aria-pressed="true"]');
        noter('US15 – le compte créé est bien organisateur', texte().indexOf('compte organisateur est créé') !== -1 && !!roleActif && roleActif.textContent.trim() === 'Organisateur');
        noter('US3 – la liste reste visible une fois connecté', doc.querySelectorAll('main li').length === 4);

        // US2 : en organisateur, on crée une sortie
        noter('US2 – en organisateur, le bouton « Créer une sortie » est là', !!bouton('Créer une sortie'));
        bouton('Créer une sortie').click();
        await attendreQue(function () { return texte().indexOf('Nouvelle sortie') !== -1; });
        bouton('Publier la sortie').click();
        await attendreQue(function () { return !!doc.querySelector('[role=alert]'); });
        noter('US2 – formulaire vide : message d\'erreur', !!doc.querySelector('[role=alert]') && doc.querySelector('[role=alert]').textContent.indexOf('titre') !== -1);
        var jour = new Date();
        jour.setDate(jour.getDate() + 20);
        var jourIso = jour.getFullYear() + '-' + String(jour.getMonth() + 1).padStart(2, '0') + '-' + String(jour.getDate()).padStart(2, '0');
        saisir('Titre de la sortie', 'Nettoyage de la grève de Kerhuon');
        saisir('Lieu de rendez-vous', 'Plage du Passage');
        saisir('Commune', 'Le Relecq-Kerhuon');
        saisir('Date', jourIso);
        saisir('Heure', '09:30');
        choisir('Durée', '90');
        saisir('Places', '12');
        saisir('Ce que les bénévoles apportent', 'bottes, une gourde');
        saisir("Ce que l'asso apporte", 'sacs poubelle, pinces');
        noter('US6 – le formulaire contient une carte pour placer le rendez-vous', !!doc.querySelector('main .leaflet-container'));
        bouton('Publier la sortie').click();
        await attendreQue(function () { return !!doc.querySelector('[role=alert]') && doc.querySelector('[role=alert]').textContent.indexOf('point de rendez-vous') !== -1; });
        noter('US6 – sans point sur la carte : message d\'erreur', !!doc.querySelector('[role=alert]') && doc.querySelector('[role=alert]').textContent.indexOf('point de rendez-vous') !== -1);
        bouton('Placer au centre de la carte').click();
        await attendreQue(function () { return !!doc.querySelector('main .leaflet-marker-icon'); });
        noter('US6 – le point de rendez-vous est placé sur la carte', !!doc.querySelector('main .leaflet-marker-icon') && texte().indexOf('Point placé') !== -1);
        bouton('Publier la sortie').click();
        await attendreQue(function () { return !!doc.querySelector('main h1') && doc.querySelector('main h1').textContent === 'Nettoyage de la grève de Kerhuon'; });
        noter('US2 – la sortie est publiée et sa fiche s\'ouvre', !!doc.querySelector('main h1') && doc.querySelector('main h1').textContent === 'Nettoyage de la grève de Kerhuon');
        noter('US2 – la fiche reprend le matériel saisi', texte().indexOf('Une gourde') !== -1 && texte().indexOf('Pinces') !== -1);
        noter('US2 – la fiche indique 12 places et 1 h 30', texte().indexOf('0 inscrit sur 12 places') !== -1 && texte().indexOf('(1 h 30)') !== -1);
        bouton('Toutes les sorties').click();
        await attendreQue(function () { return doc.querySelectorAll('main li').length === 5; });
        noter('US2 – la nouvelle sortie est dans la liste', doc.querySelectorAll('main li').length === 5 && texte().indexOf('Nettoyage de la grève de Kerhuon') !== -1);

        // Démo : on repasse en bénévole, le bouton Créer disparaît
        bouton('Bénévole').click();
        await attendreQue(function () { return !bouton('Créer une sortie'); });
        noter('Démo – en bénévole, le bouton « Créer une sortie » disparaît', !bouton('Créer une sortie'));

        // US14 : inscription à une sortie, avec le formulaire de sécurité
        doc.querySelector('main li button').click();
        await attendreQue(function () { return !!bouton("Je m'inscris"); });
        bouton("Je m'inscris").click();
        await attendreQue(function () { return !!doc.querySelector('input[name=incidents]'); });
        noter('US14 – le formulaire de sécurité s\'ouvre (blessure, coupure, chute)', ['Blessure', 'Coupure', 'Chute'].every(function (m) { return texte().indexOf(m) !== -1; }));
        noter('US14 – il rappelle les gilets jaunes et la trousse de premiers secours', texte().indexOf('Gilets jaunes') !== -1 && texte().indexOf('Trousse de premiers secours') !== -1);
        bouton('Je confirme mon inscription').click();
        await attendreQue(function () { return !!doc.querySelector('[role=alert]'); });
        noter('US14 – cases non cochées : inscription refusée', !!doc.querySelector('[role=alert]') && texte().indexOf('Tu es inscrit') === -1);
        doc.querySelector('input[name=risques]').click();
        doc.querySelector('input[name=incidents]').click();
        bouton('Je confirme mon inscription').click();
        await attendreQue(function () { return texte().indexOf('Tu es inscrit') !== -1; });
        noter('US14 – cases cochées : inscription confirmée', texte().indexOf('Tu es inscrit') !== -1 && texte().indexOf('19 inscrits sur 25 places') !== -1);
        noter('US14 – rappel de remonter tout incident à l\'asso', texte().indexOf('signaler à l\'asso') !== -1);
        bouton('Toutes les sorties').click();
        await attendreQue(function () { return doc.querySelectorAll('main li').length === 5; });

        // Onglets
        var libelles = Array.from(doc.querySelectorAll('nav button')).map(function (b) { return b.textContent.trim(); });
        noter('Onglets – Sorties, Carte, Signaler, Profil présents', libelles.join(',') === 'Sorties,Carte,Signaler,Profil');

        // US6 : la carte des sorties
        bouton('Carte').click();
        await attendreQue(function () { return doc.querySelectorAll('main .leaflet-marker-icon').length === 5; });
        noter('US6 – l\'onglet Carte s\'ouvre avec son titre', !!doc.querySelector('main h1') && doc.querySelector('main h1').textContent === 'Carte des sorties');
        noter('US6 – un point par sortie à venir (5)', doc.querySelectorAll('main .leaflet-marker-icon').length === 5, doc.querySelectorAll('main .leaflet-marker-icon').length + ' point(s)');
        noter('US6 – crédit OpenStreetMap affiché', texte().indexOf('OpenStreetMap') !== -1);
        doc.querySelector('main .leaflet-marker-icon[title="Nettoyage de la grève de Kerhuon"]').click();
        await attendreQue(function () { return !!doc.querySelector('.leaflet-popup-content'); });
        var bulle = doc.querySelector('.leaflet-popup-content');
        noter('US6 – un clic sur un point ouvre sa bulle', !!bulle && bulle.textContent.indexOf('Nettoyage de la grève de Kerhuon') !== -1 && bulle.textContent.indexOf('12 places restantes') !== -1);
        bulle.querySelector('button').click();
        await attendreQue(function () { return !!doc.querySelector('main h1') && doc.querySelector('main h1').textContent === 'Nettoyage de la grève de Kerhuon'; });
        noter('US6 – « Voir la sortie » ouvre la fiche', !!doc.querySelector('main h1') && doc.querySelector('main h1').textContent === 'Nettoyage de la grève de Kerhuon');
        bouton('Retour à la carte').click();
        await attendreQue(function () { return doc.querySelectorAll('main .leaflet-marker-icon').length === 5; });
        noter('US6 – « Retour à la carte » ramène sur la carte', doc.querySelectorAll('main .leaflet-marker-icon').length === 5);

        var titres = { Signaler: 'Signaler un endroit pollué', Profil: 'Mon profil' };
        for (var nom in titres) {
          bouton(nom).click();
          await attendreQue(function () { return !!doc.querySelector('main h1') && doc.querySelector('main h1').textContent === titres[nom]; });
          var titreOk = !!doc.querySelector('main h1') && doc.querySelector('main h1').textContent === titres[nom];
          noter('Onglets – « ' + nom + ' » s\'ouvre et reste vide', titreOk && doc.querySelectorAll('main li').length === 0);
        }
        bouton('Sorties').click();
        await attendreQue(function () { return doc.querySelectorAll('main li').length === 5; });
        noter('Onglets – retour sur « Sorties » : la liste est là', doc.querySelectorAll('main li').length === 5);

        bouton('Déconnexion').click();
        await attendreQue(function () { return !!bouton('Se connecter'); });
        noter('US15 – déconnexion', !!bouton('Se connecter'));

        bouton('Se connecter').click();
        await attendreQue(function () { return !!doc.querySelector('form'); });
        saisir('Email', 'lou@exemple.fr');
        saisir('Mot de passe', 'motdepasse1');
        bouton('Me connecter').click();
        await attendreQue(function () { return !!bouton('Déconnexion'); });
        noter('US15 – reconnexion avec le même compte', !!bouton('Déconnexion'));

        await win.FantaDB.reinitialiser();
      } catch (e) {
        noter('Erreur : ' + e.message, false);
      }
      document.getElementById('resume').textContent = nbOk + ' étape(s) OK, ' + nbKo + ' en échec';
      document.getElementById('resume').className = nbKo ? 'ko' : 'ok';
      document.title = (nbKo ? 'ECHEC ' : 'OK ') + nbOk + '/' + (nbOk + nbKo);
    }, { once: true });

    // On repart des données de démo (même origine que l'appli, donc même stockage)
    try {
      localStorage.removeItem('fantaplastic.db.v1');
      localStorage.removeItem('fantaplastic.session.v1');
    } catch (e) { /* stockage indisponible : l'appli utilisera la mémoire */ }
    // ?mode=local : le test tourne toujours sur la démo locale, même si Supabase est configuré
    document.getElementById('app').src = '../index.html?mode=local';
  </script>
</body>
</html>
