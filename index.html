<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fantaPLASTIC – Rade de Brest</title>
  <meta name="description" content="Sorties de ramassage de déchets sur le littoral de la rade de Brest.">
  <meta name="theme-color" content="#0B2A4A">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">

  <!-- Tailwind (version CDN, suffisante pour le MVP) -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marine: '#0B2A4A',
            lagon: '#2EC4B6',
            'lagon-fonce': '#0E7C74',
            corail: '#FF6B5B',
            'corail-fonce': '#B3261E',
            soleil: '#FFC845',
            sable: '#F6F1E7'
          }
        }
      }
    };
  </script>

  <!-- React 18 + htm (JSX sans étape de compilation) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js" crossorigin></script>

  <!-- Leaflet : carte interactive (US6), fonds OpenStreetMap -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>
  <style>
    .pin-fanta { background: none; border: none; }
    .leaflet-container { font-family: inherit; }
    .leaflet-popup-content { margin: 12px 14px; }
    .bulle-sortie p { margin: 0; }
    .bulle-date { font-size: 12px; font-weight: 600; color: #0E7C74; }
    .bulle-titre { margin-top: 2px !important; font-size: 15px; font-weight: 700; line-height: 1.25; color: #0B2A4A; }
    .bulle-lieu, .bulle-places { margin-top: 2px !important; font-size: 13px; color: #475569; }
    .bulle-bouton { margin-top: 8px; width: 100%; border-radius: 10px; background: #0B2A4A; padding: 7px 10px;
      font-size: 13px; font-weight: 600; color: #fff; cursor: pointer; }
    .bulle-bouton:hover { background: #163d63; }
  </style>

  <!-- Supabase (base de données et comptes), utilisé seulement si js/config.js est rempli -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" crossorigin></script>
</head>
<body class="bg-sable text-slate-900 antialiased">
  <div id="app"></div>
  <noscript>Active JavaScript pour utiliser l'application.</noscript>

  <script src="js/config.js"></script>
  <script src="js/regles.js"></script>
  <script src="js/db.js"></script>          <!-- démo locale -->
  <script src="js/db-supabase.js"></script> <!-- remplace la démo locale si config.js est rempli -->
  <script src="js/carte.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
